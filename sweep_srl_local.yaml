# 2026-09-13: cluster-only sweep (see chat) - create with `wandb sweep
# sweep_srl_local.yaml`, then run srl_sweep_coordinator.py with the printed
# sweep_id on a login node. No local `wandb agent` usage intended, so no
# program/command block (unlike sweep_td_bootstrap_gat_bufferfix.yaml).
project: srl-training-loop-sweep
method: random
metric:
  name: test_service_rate
  goal: maximize
parameters:
  reward_mode:
    value: "local"
  # 2026-09-16: narrowed max from 0.01 to 0.0015 (see chat) - empirically,
  # 4 of 5 completed local trials with actor_lr >= 0.0018 collapsed to 0.0
  # service rate (policy drifts to always-reject), while the one trial at
  # actor_lr=0.0012 reached 0.64. The old 1e-4..1e-2 range was wasting most
  # trials on a collapse-prone region.
  actor_lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.0015
  critic_lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
