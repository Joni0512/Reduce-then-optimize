program: rtv_solver/pipeline/sweep_srl_replaybuffer_trial_v3.py
project: srl-replaybuffer-sweep
method: bayes
metric:
  name: mean_final_service_rate
  goal: maximize
parameters:
  replay_capacity:
    values: [60, 80, 100, 120]
  critic_lr:
    distribution: log_uniform_values
    min: 0.003
    max: 0.05
  sigma:
    distribution: uniform
    min: 0.5
    max: 1.5
command:
  - ./venv/bin/python3
  - ${program}
