<svg viewBox="0 0 1500 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>RR-Graph Pruning Pipeline</title>
  <desc>Four-panel diagram showing active requests within one rolling-horizon window, the complete request-request graph, GNN edge scoring against a threshold, and the pruned RR-graph that feeds into RTV generation.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="560" fill="#ffffff"/>

  <!-- Top banner: rolling-horizon window scope -->
  <rect x="40" y="20" width="1420" height="44" rx="6" fill="#F2F2F2" stroke="#CCCCCC"/>
  <text x="750" y="48" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">
    Performed once per rolling-horizon window [tᵢ, tᵢ + t_OH] — recomputed at every iteration, not globally
  </text>

  <!-- ===================== Panel 1: Active Requests ===================== -->
  <g transform="translate(40,100)">
    <text x="150" y="0" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Active Requests</text>

    <g font-size="17" fill="#1a1a1a">
      <circle cx="80" cy="110" r="19" fill="#276575"/>
      <text x="80" y="116" text-anchor="middle" fill="#ffffff" font-weight="600">a</text>

      <circle cx="220" cy="110" r="19" fill="#276575"/>
      <text x="220" y="116" text-anchor="middle" fill="#ffffff" font-weight="600">b</text>

      <circle cx="80" cy="250" r="19" fill="#276575"/>
      <text x="80" y="256" text-anchor="middle" fill="#ffffff" font-weight="600">c</text>

      <circle cx="220" cy="250" r="19" fill="#276575"/>
      <text x="220" y="256" text-anchor="middle" fill="#ffffff" font-weight="600">d</text>
    </g>

    <text x="150" y="330" text-anchor="middle" font-size="14" fill="#555555">no pairs evaluated yet</text>
  </g>

  <path d="M330,220 L385,220" stroke="#333333" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- ===================== Panel 2: Complete RR-Graph ===================== -->
  <g transform="translate(405,100)">
    <text x="150" y="0" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Complete RR-Graph</text>

    <g stroke="#A6A6A6" stroke-width="2">
      <line x1="80" y1="110" x2="220" y2="110"/>
      <line x1="80" y1="250" x2="220" y2="250"/>
      <line x1="80" y1="110" x2="80" y2="250"/>
      <line x1="220" y1="110" x2="220" y2="250"/>
      <line x1="80" y1="110" x2="220" y2="250"/>
      <line x1="220" y1="110" x2="80" y2="250"/>
    </g>

    <g font-size="17" fill="#1a1a1a">
      <circle cx="80" cy="110" r="19" fill="#276575"/>
      <text x="80" y="116" text-anchor="middle" fill="#ffffff" font-weight="600">a</text>

      <circle cx="220" cy="110" r="19" fill="#276575"/>
      <text x="220" y="116" text-anchor="middle" fill="#ffffff" font-weight="600">b</text>

      <circle cx="80" cy="250" r="19" fill="#276575"/>
      <text x="80" y="256" text-anchor="middle" fill="#ffffff" font-weight="600">c</text>

      <circle cx="220" cy="250" r="19" fill="#276575"/>
      <text x="220" y="256" text-anchor="middle" fill="#ffffff" font-weight="600">d</text>
    </g>

    <text x="150" y="330" text-anchor="middle" font-size="14" fill="#555555">all C(n,2) request pairs</text>
  </g>

  <path d="M695,220 L750,220" stroke="#333333" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- ===================== Panel 3: GNN Edge Scoring + threshold gauge ===================== -->
  <g transform="translate(770,100)">
    <text x="150" y="0" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">GNN Edge Scoring</text>

    <g stroke-linecap="round">
      <line x1="80" y1="110" x2="220" y2="110" stroke="#3E8F6C" stroke-width="4.5"/>
      <line x1="80" y1="250" x2="220" y2="250" stroke="#3E8F6C" stroke-width="4.5"/>
      <line x1="80" y1="110" x2="80" y2="250" stroke="#3E8F6C" stroke-width="4"/>
      <line x1="80" y1="110" x2="220" y2="250" stroke="#A6493A" stroke-width="1.75" stroke-dasharray="5,5"/>
      <line x1="220" y1="110" x2="80" y2="250" stroke="#A6493A" stroke-width="1.75" stroke-dasharray="5,5"/>
      <line x1="220" y1="110" x2="220" y2="250" stroke="#A6493A" stroke-width="1.75" stroke-dasharray="5,5"/>
    </g>

    <g font-size="17" fill="#1a1a1a">
      <circle cx="80" cy="110" r="19" fill="#276575"/>
      <text x="80" y="116" text-anchor="middle" fill="#ffffff" font-weight="600">a</text>

      <circle cx="220" cy="110" r="19" fill="#276575"/>
      <text x="220" y="116" text-anchor="middle" fill="#ffffff" font-weight="600">b</text>

      <circle cx="80" cy="250" r="19" fill="#276575"/>
      <text x="80" y="256" text-anchor="middle" fill="#ffffff" font-weight="600">c</text>

      <circle cx="220" cy="250" r="19" fill="#276575"/>
      <text x="220" y="256" text-anchor="middle" fill="#ffffff" font-weight="600">d</text>
    </g>

    <text x="150" y="330" text-anchor="middle" font-size="14" fill="#555555">score(i,j) in (0,1) per edge</text>

    <!-- threshold gauge, own row, clear of everything else -->
    <g transform="translate(0,365)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#CCCCCC" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="150" y2="0" stroke="#A6493A" stroke-width="6" stroke-linecap="round"/>
      <line x1="150" y1="0" x2="300" y2="0" stroke="#3E8F6C" stroke-width="6" stroke-linecap="round"/>
      <circle cx="150" cy="0" r="7" fill="#1a1a1a"/>
      <text x="150" y="-14" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">τ (threshold)</text>
      <text x="0" y="26" text-anchor="start" font-size="13" fill="#A6493A">score &lt; τ: pruned</text>
      <text x="300" y="26" text-anchor="end" font-size="13" fill="#3E8F6C">score ≥ τ: kept</text>
    </g>
  </g>

  <path d="M1080,220 L1135,220" stroke="#333333" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- ===================== Panel 4: Pruned RR-Graph ===================== -->
  <g transform="translate(1155,100)">
    <text x="150" y="0" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Pruned RR-Graph</text>

    <g stroke="#3E8F6C" stroke-linecap="round">
      <line x1="80" y1="110" x2="220" y2="110" stroke-width="4.5"/>
      <line x1="80" y1="250" x2="220" y2="250" stroke-width="4.5"/>
      <line x1="80" y1="110" x2="80" y2="250" stroke-width="4"/>
    </g>

    <g font-size="17" fill="#1a1a1a">
      <circle cx="80" cy="110" r="19" fill="#276575"/>
      <text x="80" y="116" text-anchor="middle" fill="#ffffff" font-weight="600">a</text>

      <circle cx="220" cy="110" r="19" fill="#276575"/>
      <text x="220" y="116" text-anchor="middle" fill="#ffffff" font-weight="600">b</text>

      <circle cx="80" cy="250" r="19" fill="#276575"/>
      <text x="80" y="256" text-anchor="middle" fill="#ffffff" font-weight="600">c</text>

      <circle cx="220" cy="250" r="19" fill="#276575"/>
      <text x="220" y="256" text-anchor="middle" fill="#ffffff" font-weight="600">d</text>
    </g>

    <text x="150" y="330" text-anchor="middle" font-size="14" fill="#555555">edges with score &lt; τ removed</text>
  </g>

  <!-- bottom caption, own clear band -->
  <rect x="40" y="500" width="1420" height="42" rx="6" fill="#F2F2F2" stroke="#CCCCCC"/>
  <text x="750" y="526" text-anchor="middle" font-size="14.5" fill="#333333">
    feeds into RTV generation (Fig. 7): fewer surviving pairs shrink the RV-/RTV-graph and the downstream ILP
  </text>

</svg>
